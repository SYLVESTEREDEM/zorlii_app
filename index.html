    function drawThread(){if(!threadState)return;const state=threadState,previousComposer=document.getElementById('thread-reply-form');const post=state.post;const replies=state.replies||[];const postMarkup=post?postCardsMarkup([post],true):'<p class="tiny">The original post is unavailable.</p>';const replyMarkupText=replies.map(reply=>replyMarkup(reply,state.id)).join('');const replyStatus=state.loading||state.refreshing?'Loading replies…':state.error?`Could not load replies: ${esc(state.error)}`:replies.length?`${replies.length} ${replies.length===1?'reply':'replies'}${state.hasMore?' loaded · more replies available':''}`:'No replies yet. Start the conversation.';base(`<button type="button" class="quiet thread-back" data-action="thread-back">‹ Back</button><div class="topline"><div><div class="eyebrow">Conversation thread</div><h1>Thread</h1></div><button type="button" class="quiet" data-action="refresh-thread"${state.refreshing?' disabled':''}>${state.refreshing?'Refreshing…':'Refresh thread'}</button></div>${state.loading&&!post?'<p role="status">Loading the original post…</p>':''}<div id="thread-original">${postMarkup}</div><section class="thread-replies"><h2>Replies · ${Number(post?.reply_count)||replies.length}</h2><p class="tiny thread-status" id="thread-status" role="status">${replyStatus}</p><div id="thread-replies-list">${replyMarkupText}</div>${state.error?'<button type="button" class="quiet" data-action="retry-thread">Retry loading replies</button>':''}${state.hasMore?`<button type="button" class="quiet" data-action="more-thread-replies"${state.loadingMore?' disabled':''}>${state.loadingMore?'Loading…':'Load more replies'}</button>`:''}${post?replyComposerMarkup(post.id):''}</section>`);if(previousComposer&&post&&Number(previousComposer.dataset.reply)===Number(post.id)){document.getElementById('thread-reply-form')?.replaceWith(previousComposer)}}

    async function refreshThread({initial=false}={}){
      const state=threadState;
      if(!state)return;
      if(state.loadingMorePromise){await state.loadingMorePromise;if(threadState!==state)return}
      if(state.refreshPromise){await state.refreshPromise;if(threadState===state)return refreshThread();return}
      let finishRefresh;
      state.refreshPromise=new Promise(resolve=>{finishRefresh=resolve});
      state.loading=initial;state.refreshing=true;state.error='';
      try{
        let page=await api(`/api/posts/${encodeURIComponent(state.id)}`);
        if(threadState!==state)return;
        let post=page.post||state.post,replies=page.replies||[];
        let hasMore=typeof page.has_more==='boolean'?page.has_more:Number(post?.reply_count)>replies.length;
        let cursor=page.next_after_id??replies.at(-1)?.id??null;
        while(hasMore&&(!initial||(state.replyId&&!replies.some(reply=>String(reply.id)===String(state.replyId))))){
          if(cursor===null)throw Error('The next reply page could not be located.');
          const previousCursor=cursor;
          page=await api(`/api/posts/${encodeURIComponent(state.id)}?after_id=${encodeURIComponent(cursor)}&limit=100`);
          if(threadState!==state)return;
          post=page.post||post;
          const known=new Set(replies.map(reply=>String(reply.id)));
          const added=(page.replies||[]).filter(reply=>!known.has(String(reply.id)));
          replies=[...replies,...added];
          hasMore=typeof page.has_more==='boolean'?page.has_more:Number(post?.reply_count)>replies.length;
          cursor=page.next_after_id??replies.at(-1)?.id??null;
          if(hasMore&&(!added.length||cursor===previousCursor))throw Error('The server did not return the next reply page.');
        }
        state.post=post;state.replies=replies;state.hasMore=hasMore;state.nextAfterId=cursor;
        state.loading=false;state.refreshing=false;state.error='';drawThread();
        if(state.replyId)requestAnimationFrame(()=>document.querySelector(`[data-reply-card="${Number(state.replyId)}"]`)?.scrollIntoView({block:'center',behavior:'smooth'}));
      }catch(error){
        if(threadState!==state)return;
        state.loading=false;state.refreshing=false;state.error=error.message||'Please try again.';drawThread();
      }finally{state.refreshPromise=null;finishRefresh()}
    }
    async function loadMoreThreadReplies(){
      const state=threadState;
      if(!state||!state.hasMore||state.loadingMore||state.refreshPromise)return;
      const cursor=state.nextAfterId??state.replies.at(-1)?.id;
      if(!cursor){state.error='The next reply page could not be located.';drawThread();return}
      let finishLoading;
      state.loadingMorePromise=new Promise(resolve=>{finishLoading=resolve});
      state.loadingMore=true;state.error='';
      const button=document.querySelector('[data-action="more-thread-replies"]');
      if(button){button.disabled=true;button.textContent='Loading…'}
      try{
        const data=await api(`/api/posts/${encodeURIComponent(state.id)}?after_id=${encodeURIComponent(cursor)}&limit=100`);
        if(threadState!==state)return;
        const known=new Set(state.replies.map(reply=>String(reply.id)));
        const added=(data.replies||[]).filter(reply=>!known.has(String(reply.id)));
        const hasMore=typeof data.has_more==='boolean'?data.has_more:Number(data.post?.reply_count)>state.replies.length+added.length;
        const next=data.next_after_id??added.at(-1)?.id??state.replies.at(-1)?.id??null;
        if(hasMore&&(!added.length||next===cursor))throw Error('The server did not return the next reply page.');
        state.replies.push(...added);state.post=data.post||state.post;state.hasMore=hasMore;state.nextAfterId=next;
        state.loadingMore=false;state.error='';drawThread();
      }catch(error){
        if(threadState!==state)return;
        state.loadingMore=false;state.error=error.message||'Please try again.';drawThread();
      }finally{state.loadingMorePromise=null;finishLoading()}
    }

    `;
    document.head.appendChild(addedStyles);

    function replaceRenderedBody(card, body) {
      let copy = [...card.children].find(child => child.classList?.contains("post-copy"));
      if (!body) {
        copy?.remove();
        return;
      }
      if (!copy) {
        copy = document.createElement("div");
        copy.className = "post-copy";
        const before = [...card.children].find(child => child.classList?.contains("post-media")
          || child.classList?.contains("quoted-item") || child.classList?.contains("post-actions"));
        card.insertBefore(copy, before || null);
      }
      copy.innerHTML = mentionMarkup(body);
    }

    function updateContentReferences(type, item) {
      if (type === "post") {
        contentItems.posts[item.id] = item;
        const profile = document.getElementById("profile-posts")?.profilePagination;
        if (profile) profile.posts = profile.posts.map(post => post.id === item.id ? item : post);
        const hashtag = document.getElementById("hashtag-posts")?.tagState;
        if (hashtag) hashtag.posts = hashtag.posts.map(post => post.id === item.id ? item : post);
        document.querySelectorAll(`article.post[data-post="${CSS.escape(String(item.id))}"]`)
          .forEach(card => replaceRenderedBody(card, item.body || ""));
        return;
      }
      contentItems.replies[item.id] = item;
      Object.keys(threadReplies).forEach(postId => {
        threadReplies[postId] = (threadReplies[postId] || []).map(reply => reply.id === item.id ? item : reply);
      });
      document.querySelectorAll(`article.reply-card[data-reply-card="${CSS.escape(String(item.id))}"]`)
        .forEach(card => replaceRenderedBody(card, item.body || ""));
    }

    function removeContentFromView(type, id, parentPostId) {
      if (type === "post") {
        document.querySelectorAll(`article.post[data-post="${CSS.escape(String(id))}"]`).forEach(card => card.remove());
        delete contentItems.posts[id];
        const profile = document.getElementById("profile-posts")?.profilePagination;
        if (profile) profile.posts = profile.posts.filter(post => post.id !== id);
        const hashtag = document.getElementById("hashtag-posts")?.tagState;
        if (hashtag) hashtag.posts = hashtag.posts.filter(post => post.id !== id);
        return;
      }
      document.querySelectorAll(`article.reply-card[data-reply-card="${CSS.escape(String(id))}"]`).forEach(card => card.remove());
      delete contentItems.replies[id];
      Object.keys(threadReplies).forEach(postId => {
        threadReplies[postId] = (threadReplies[postId] || []).filter(reply => reply.id !== id).map(clearDeletedReplyQuote);
      });
      function clearDeletedReplyQuote(item) {
        return Number(item.quoted_reply?.id) === Number(id) ? { ...item, quoted_reply: null, quoted_reply_id: null } : item;
      }
      const clearVisibleQuote = card => {
        card?.querySelectorAll(":scope > .quoted-item").forEach(quote => {
          if (quote.querySelector(".quoted-label")?.textContent === "Original reply") quote.remove();
        });
      };
      Object.values(contentItems.replies).forEach(reply => {
        if (Number(reply.quoted_reply?.id) !== Number(id)) return;
        contentItems.replies[reply.id] = clearDeletedReplyQuote(reply);
        document.querySelectorAll(`article.reply-card[data-reply-card="${CSS.escape(String(reply.id))}"]`).forEach(clearVisibleQuote);
      });
      const dependentPostIds = Object.values(contentItems.posts)
        .filter(post => post.reposted_reply && Number(post.quoted_reply?.id) === Number(id))
        .map(post => post.id);
      Object.values(contentItems.posts).forEach(post => {
        if (post.reposted_reply || Number(post.quoted_reply?.id) !== Number(id)) return;
        contentItems.posts[post.id] = clearDeletedReplyQuote(post);
        document.querySelectorAll(`article.post[data-post="${CSS.escape(String(post.id))}"]`).forEach(clearVisibleQuote);
      });
      const profile = document.getElementById("profile-posts")?.profilePagination;
      if (profile) profile.posts = profile.posts.map(clearDeletedReplyQuote);
      const hashtag = document.getElementById("hashtag-posts")?.tagState;
      if (hashtag) hashtag.posts = hashtag.posts.map(clearDeletedReplyQuote);
      dependentPostIds.forEach(postId => {
        removeContentFromView("post", postId);
        delete threadReplies[postId];
        expandedReplyPosts.delete(Number(postId));
      });
      if (parentPostId) {
        const parent = contentItems.posts[parentPostId];
        if (parent) {
          parent.reply_count = Math.max(0, Number(parent.reply_count || 0) - 1);
          const card = document.querySelector(`article.post[data-post="${CSS.escape(String(parentPostId))}"]`);
          const repliesButton = card?.querySelector('[data-action="replies"]');
          if (repliesButton) repliesButton.textContent = `Reply · ${parent.reply_count}`;
        }
      }
    }

    function contentEditorDialog() {
      let dialog = document.getElementById("content-editor-dialog");
      if (dialog) return dialog;
      dialog = document.createElement("dialog");
      dialog.id = "content-editor-dialog";
      dialog.className = "content-editor";
      dialog.setAttribute("aria-labelledby", "content-editor-title");
      dialog.innerHTML = `<form id="content-editor-form"><h2 id="content-editor-title">Edit content</h2><label class="sr-only" for="content-editor-body">Edit text</label><textarea class="field" id="content-editor-body" name="body"></textarea><div class="tiny" id="content-editor-limit"></div><div class="content-editor-actions"><button type="button" class="quiet" data-action="cancel-content-edit">Cancel</button><button type="submit" class="primary">Save changes</button></div></form>`;
      dialog.addEventListener("click", event => { if (event.target === dialog) dialog.close(); });
      document.body.appendChild(dialog);
      return dialog;
    }

    document.addEventListener("toggle", event => {
      if (event.target.matches?.("details.content-menu")) {
        event.target.querySelector("summary")?.setAttribute("aria-expanded", String(event.target.open));
      }
    }, true);

    document.addEventListener("click", async event => {
      const target = event.target instanceof Element ? event.target : null;
      if (!target) return;
      const containingMenu = target.closest("details.content-menu");
      document.querySelectorAll("details.content-menu[open]").forEach(menu => {
        if (menu !== containingMenu || target.closest(".content-menu-options button")) {
          menu.open = false;
          menu.querySelector("summary")?.setAttribute("aria-expanded", "false");
        }
      });
      const summary = target.closest("details.content-menu > summary");
      if (summary) requestAnimationFrame(() => {
        const menu = summary.parentElement;
        const options = menu.querySelector(".content-menu-options");
        const rect = summary.getBoundingClientRect();
        const availableBelow = window.innerHeight - rect.bottom - 8;
        const availableAbove = rect.top - 8;
        const menuHeight = Math.min(options.scrollHeight, window.innerHeight - 16);
        menu.classList.toggle("flip-up", menu.open && availableBelow < menuHeight + 8 && availableAbove > availableBelow);
        summary.setAttribute("aria-expanded", String(menu.open));
      });

      const button = target.closest('button[data-action^="content-"],button[data-action="cancel-content-edit"]');
      if (!button) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      if (button.dataset.action === "cancel-content-edit") {
        document.getElementById("content-editor-dialog")?.close();
        return;
      }
      const type = button.dataset.type === "reply" ? "reply" : "post";
      const item = contentItems[type === "post" ? "posts" : "replies"][button.dataset.id];
      if (!item) { toast("This item is no longer available."); return; }
      const attributedText = `${item.body || ""}\n\n— ${item.author.display_name || item.author.username} (@${item.author.username})`;
      try {
        if (button.dataset.action === "content-copy") {
          if (!navigator.clipboard?.writeText) throw new Error("Clipboard access is unavailable in this browser.");
          await navigator.clipboard.writeText(attributedText);
          toast("Content and author attribution copied.");
        } else if (button.dataset.action === "content-share") {
          if (!navigator.share) throw new Error("Sharing is unavailable in this browser.");
          await navigator.share({ title: `Zorlii ${type} by ${item.author.display_name || item.author.username}`, text: attributedText });
        } else if (button.dataset.action === "content-edit") {
          if (!me || Number(item.author.id) !== Number(me.id)) throw new Error("Only the author can edit this content.");
          const dialog = contentEditorDialog();
          const form = dialog.querySelector("#content-editor-form");
          form.dataset.type = type;
          form.dataset.id = String(item.id);
          form.dataset.parent = button.closest("article.post")?.dataset.post || "";
          const field = form.elements.body;
          field.maxLength = type === "post" ? 5000 : 4000;
          field.value = item.body || "";
          dialog.querySelector("#content-editor-title").textContent = `Edit ${type}`;
          dialog.querySelector("#content-editor-limit").textContent = `Up to ${field.maxLength} characters. Existing media and quoted content stay attached.`;
          if (typeof dialog.showModal === "function") dialog.showModal();
          else dialog.setAttribute("open", "");
          requestAnimationFrame(() => field.focus());
        } else if (button.dataset.action === "content-delete") {
          if (!me || Number(item.author.id) !== Number(me.id)) throw new Error("Only the author can delete this content.");
          const warning = type === "reply"
            ? "This permanently deletes the reply and may also remove reposts of it and replies to those reposts."
            : "This permanently deletes the post, its replies and its uploaded media.";
          if (!confirm(`Permanently delete this ${type}? ${warning}`)) return;
          const parentPostId = Number(button.dataset.parent) || undefined;
          await api(`/api/${type === "post" ? "posts" : "replies"}/${encodeURIComponent(button.dataset.id)}`, { method: "DELETE" });
          invalidateFeedUpdates();
          removeContentFromView(type, item.id, parentPostId);
          toast(`${type === "post" ? "Post" : "Reply"} deleted.`);
        }
      } catch (error) {
        if (error?.name === "AbortError") return;
        toast(error.message || `Could not ${button.dataset.action?.replace("content-", "") || "update"} this content.`);
      }
    }, true);

    document.addEventListener("keydown", event => {
      if (event.key !== "Escape") return;
      const open = document.querySelector("details.content-menu[open]");
      if (!open) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      open.open = false;
      open.querySelector("summary")?.setAttribute("aria-expanded", "false");
      open.querySelector("summary")?.focus();
    }, true);

    document.addEventListener("submit", async event => {
      const form = event.target;
      if (!(form instanceof HTMLFormElement) || form.id !== "content-editor-form") return;
      event.preventDefault();
      event.stopImmediatePropagation();
      const type = form.dataset.type === "reply" ? "reply" : "post";
      const item = contentItems[type === "post" ? "posts" : "replies"][form.dataset.id];
      if (!item) { toast("This item is no longer available."); return; }
      if (!me || Number(item.author.id) !== Number(me.id)) { toast("Only the author can edit this content."); return; }
      const body = form.elements.body.value;
      if (!body.trim() && !item.media?.length && !item.quoted_post && !item.quoted_reply) {
        toast("Add text, media, or an original before saving.");
        return;
      }
      try {
        const result = await api(`/api/${type === "post" ? "posts" : "replies"}/${encodeURIComponent(form.dataset.id)}`, {
          method: "PATCH", body: JSON.stringify({ body }),
        });
        const updated = type === "post" ? result.post : result;
        invalidateFeedUpdates();
        updateContentReferences(type, updated);
        document.getElementById("content-editor-dialog")?.close();
        toast(`${type === "post" ? "Post" : "Reply"} updated.`);
      } catch (error) { toast(error.message || `Could not update this ${type}.`); }
    }, true);

    function updateNotificationsButton() {
      const button = document.querySelector('nav[aria-label="Main navigation"] [data-go="notifications"]');
      if (!button) return;
      button.classList.toggle("active", screen === "notifications");
      const unreadLabel = notificationUnreadCount ? `, ${notificationUnreadCount} unread` : "";
      button.setAttribute("aria-label", `Activities${unreadLabel}`);
      const label = "Activities";
      const content = `${label}${notificationUnreadCount ? `<span class="count-badge">${notificationUnreadCount}</span>` : ""}`;
      if (button.innerHTML !== content) button.innerHTML = content;
    }
    window.addEventListener("resize", updateNotificationsButton);

    function notificationDescription(item) {
      if(item.kind==='mention'){
        const actor=profileLinkMarkup(item.actor?.username,`@${item.actor?.username||'member'}`,'profile-link');
        if(item.post_id){const subject=item.reply_id?'reply':'post';return `${actor} mentioned you in a <a class="profile-link" href="#post/${encodeURIComponent(item.post_id)}" data-action="open-mentioned-post" data-post="${esc(item.post_id)}"${item.reply_id?` data-reply="${esc(item.reply_id)}"`:''}>${subject}</a>.`}
        return `${actor} mentioned you.`;
      }
      return esc(activityDescription(item));
    }

    async function renderNotifications() {
      screen = "notifications";
      base('<div class="eyebrow">Member activity</div><h1>Activities</h1><p class="subtitle">Loading your updates…</p>');
      try {
        const data = await api("/api/notifications");
        notificationUnreadCount = data.unread_count;
        activityUnreadCount = data.unread_count;
        const rows = data.notifications.map(item => `<article class="notification-item ${item.read ? "read" : "unread"}">
          <div class="notification-person">${avatarMarkup(item.actor)}<div><strong>${profileLinkMarkup(item.actor?.username,item.actor?.display_name||'Member','profile-link')}</strong> <span class="handle">${profileLinkMarkup(item.actor?.username,`@${item.actor?.username||''}`,'profile-link')}</span></div></div>
          <p>${notificationDescription(item)}</p>
          <time datetime="${esc(item.created_at||'')}">${esc(formatTimestamp(item.created_at,{dateStyle:'medium',timeStyle:'short'}))}</time>
          ${item.read ? '<span class="tiny"> · Read</span>' : `<button class="quiet" data-action="notification-read" data-id="${item.id}">Mark as read</button>`}
        </article>`).join("");
        base(`<div class="topline"><div><div class="eyebrow">Member activity</div><h1>Activities</h1><p class="subtitle">Readable updates when members follow, reply, react, Echo, share a thought, or message.</p></div>
          <div>${notificationUnreadCount ? '<button class="quiet" data-action="notifications-read-all">Mark all as read</button>' : ""} <button class="quiet" data-action="notifications-refresh">Refresh</button></div></div>
          ${rows || '<div class="empty"><h2>You’re all caught up.</h2><p>New activity from real members will appear here.</p></div>'}`);
        updateNotificationsButton();

        const threadId = kind === "reply" ? item.post_id : item.id;
        const open = Number.isSafeInteger(Number(threadId)) && Number(threadId) > 0
          ? `<button type="button" class="quoted-open" data-action="open-thread" data-id="${esc(threadId)}" aria-label="Open thread for quoted ${esc(kind)} by @${esc(item.author?.username || "member")}"><span class="quoted-label">Open quoted ${esc(kind)} thread</span><span class="post-copy">${esc(item.body || "View the original conversation.")}</span></button>`
          : `<div class="quoted-label">Original ${esc(kind)}</div>`;
        return `<article class="quoted-item">${open}<div class="post-head">${avatarMarkup(item.author)}<div class="identity"><strong>${profileLinkMarkup(item.author?.username,item.author?.display_name||"Member","profile-link")}</strong><span class="handle">${profileLinkMarkup(item.author?.username,`@${item.author?.username||""}`,"profile-link")}</span></div></div>${item.media?.length?`<div class="post-media">${mediaMarkup(item.media)}</div>`:""}</article>`;
      };

      const gameInstructions = {
        "tile-quest": "Slide tiles in one direction to merge matching numbers and build your score.",
        "summit-steps": "Reach for a highlighted hold in your lane or an adjacent lane before the 12-second timer ends.",
        "quick-math": "Choose the correct answer to each math question. There are ten rounds.",
        "word-scramble": "Unscramble the letters and choose the matching word. There are ten rounds.",
        "odd-one-out": "Choose the item that does not belong. There are ten rounds.",
        "number-pattern": "Find the next number in the sequence. There are ten rounds.",
        "color-match": "Choose the color named by the prompt. There are ten rounds.",
      };
      let gameRulesAccepted = false;
      renderGames = async function () {
        const data = await api("/api/games");
        screen = "games";
        selectedGame = null;
        gameRun = null;
        gameRulesAccepted = false;
        base(`<div class="game-page"><div class="eyebrow">Take a little break</div><h1>Mini games</h1>
          <p class="subtitle">Pick a game and climb its leaderboard. Your best score and username are visible to other members.</p>
          ${data.games.map(game => `<article class="game-card"><div class="eyebrow">${game.id === "tile-quest" ? "Puzzle" : "Quick play"}</div>
            <h2>${esc(game.name)}</h2><p>${esc(game.description)}</p><button class="primary" data-action="choose-game" data-game="${esc(game.id)}" data-name="${esc(game.name)}">Open game</button></article>`).join("")}</div>`);
      };
      openGame = async function (id, name) {
        const game = { id, name };
        selectedGame = game;
        gameRun = null;
        gameRulesAccepted = false;
        screen = "game";
        base(`<div class="game-page"><button class="quiet" data-go="games">‹ All games</button><div class="eyebrow">Zorlii arcade</div>
          <h1>${esc(name)}</h1><p class="subtitle">Your best score and username appear on this game's leaderboard. An internet connection is required.</p>
          <div id="game-play"><p role="status">Loading game…</p></div>
          <section class="game-card"><h2>Leaderboard</h2><p class="tiny">All-time personal bests, highest first.</p>
          <button class="quiet" data-action="refresh-game-scores">Refresh scores</button><div id="game-leaderboard" aria-live="polite">Loading scores…</div></section></div>`);
        try {
          const current = await api(`/api/games/${encodeURIComponent(id)}/run`);
          if (screen === "game" && selectedGame === game) { gameRun = current.run; drawGame(); }
        } catch (error) {
          const target = document.getElementById("game-play");
          if (target && selectedGame === game) target.innerHTML = `<p role="alert">${esc(error.message)} Return to all games to retry.</p>`;
        }
        try { await loadGameLeaderboard(true); }
        catch (error) {
          const target = document.getElementById("game-leaderboard");
          if (target && selectedGame === game) target.textContent = error.message;
        }
      };
      drawGame = function () {
        clearInterval(gameCountdownTimer);
        const target = document.getElementById("game-play");
        if (!target || !selectedGame) return;
        const state = gameRun?.state;
        let content = `<p>${esc(gameInstructions[selectedGame.id] || "Follow the game prompt and choose an answer.")}</p>`;
        if (state) {
          content += `<p>Score <strong>${Number(state.score) || 0}</strong>${Number.isFinite(state.round) && Number.isFinite(state.total_rounds) ? ` · Round ${state.round} of ${state.total_rounds}` : ""}</p>`;
          if (typeof state.correct === "boolean") {
            content += `<p class="game-feedback" role="status" aria-live="polite">${state.correct ? "Correct!" : "Not quite. Keep going."}</p>`;
          }
          if (selectedGame.id === "tile-quest" && Array.isArray(state.board)) {
            content += `<div class="game-board" aria-label="Tile board">${state.board.flat().map(value => `<div class="game-tile ${value ? "filled" : ""}">${Number(value) || ""}</div>`).join("")}</div>`;
            if (!state.over) content += `<div class="game-controls">${[["up","↑"],["left","←"],["down","↓"],["right","→"]].map(([action,label]) => `<button class="quiet" data-action="game-move" data-move="${action}" aria-label="Move ${action}" ${gameRulesAccepted ? "" : "disabled"}>${label}</button>`).join("")}</div>`;
          } else if (selectedGame.id === "summit-steps" && Array.isArray(state.holds) && state.lane !== undefined) {
            content += `<p>You are on the ${["left","center","right"][state.lane]} hold. Choose a marked hold in your lane or an adjacent lane within 12 seconds.</p>
              <div class="game-cliff" aria-hidden="true"><div class="game-lanes">${[0,1,2].map(index => `<span>${state.holds.includes(index) ? "◆" : "·"}</span>`).join("")}</div>
              <div class="game-lanes">${[0,1,2].map(index => `<span>${state.lane === index ? "●" : "·"}</span>`).join("")}</div></div>
              ${state.over ? "" : `<p id="game-countdown" aria-live="off"></p><div class="game-controls">${["left","center","right"].map((lane,index) => `<button class="${state.holds.includes(index) ? "primary" : "quiet"}" data-action="game-move" data-move="${lane}" ${gameRulesAccepted ? "" : "disabled"}>${lane}${state.holds.includes(index) ? " · hold" : ""}</button>`).join("")}</div>`}`;
          } else if (state.prompt && Array.isArray(state.choices)) {
            content += `<p class="game-prompt" aria-live="polite">${esc(state.prompt)}</p>`;
            if (!state.over) content += `<div class="game-controls">${state.choices.map(choice => `<button class="quiet game-choice" data-action="game-move" data-move="${esc(choice.id)}" ${gameRulesAccepted ? "" : "disabled"}>${esc(choice.label)}</button>`).join("")}</div>`;
          }
          if (state.over) content += "<p>Game over! Your best score has been saved.</p>";
        } else {
          content += "<p>No active run yet. Start when you’re ready.</p>";
        }
        content += `<label class="game-rules"><input type="checkbox" id="game-rules-ack" ${gameRulesAccepted ? "checked" : ""}>
          <span>I’ve read and understand the instructions for this game.</span></label>
          <button class="primary" data-action="start-game" ${gameRulesAccepted ? "" : "disabled"}>${state ? "Start over" : "Start playing"}</button>`;
        target.innerHTML = `<div class="game-card">${content}</div>`;
        if (state && !state.over && selectedGame.id === "summit-steps" && Number.isFinite(state.deadline)) {
          const started = performance.now(), initial = Math.max(0, state.deadline - gameRun.server_time);
          const tick = () => {
            const countdown = document.getElementById("game-countdown");
            if (!countdown) { clearInterval(gameCountdownTimer); return; }
            const left = Math.max(0, Math.ceil(initial - (performance.now() - started) / 1000));
            countdown.textContent = left ? `${left} seconds left` : "Time is up — choose a hold to finish.";
          };
          tick();
          gameCountdownTimer = setInterval(tick, 250);
        }
      };
      document.addEventListener("change", event => {
        if (event.target?.id !== "game-rules-ack") return;
        gameRulesAccepted = event.target.checked;
        document.querySelectorAll('[data-action="game-move"],[data-action="start-game"]').forEach(button => { button.disabled = !gameRulesAccepted; });
      });
      startGame = async function () {
        if (gameBusy || !selectedGame) return;
        if (!gameRulesAccepted) { toast("Read and acknowledge the instructions before playing."); return; }
        if (gameRun && !gameRun.state.over && !confirm("Start over? Your current game will end, but your best score will be kept.")) return;
        gameBusy = true;
        const game = selectedGame;
        try {
          const run = await api(`/api/games/${encodeURIComponent(game.id)}/start`, { method: "POST" });
          if (screen === "game" && selectedGame === game) { gameRun = run; drawGame(); }
        } catch (error) { toast(error.message); }
        finally { gameBusy = false; }
      };
      document.addEventListener("click", event => {
        if (event.target.closest('[data-action="game-move"]') && !gameRulesAccepted) event.preventDefault();
      }, true);

      if (me && screen === "feed") base(document.querySelector(".main")?.innerHTML || "", document.querySelector(".right")?.innerHTML || "");
    })();
  </script>
</body>
</html>
