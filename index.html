    .media-picker input{position:absolute;width:1px;height:1px;opacity:0}
    .selected-media{flex-basis:100%;overflow-wrap:anywhere;color:#000;font-size:12px}
    .status{background:#17122b;color:#fff;border:1px solid #644da1;box-shadow:0 10px 32px #0009}
    .danger{color:#ffb5c6!important;border-color:#754052!important}
    button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #b195ff;outline-offset:3px}
    @media(max-width:1050px){.shell{grid-template-columns:220px minmax(0,1fr)}}
    @media(max-width:670px){
      body{background:radial-gradient(ellipse at 80% -4%,#30205c66,transparent 36%),linear-gradient(160deg,#080a16,#0b0d1d 68%,#0a0c19)}
      .shell{display:block;min-height:100vh;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
      .sidebar{position:fixed;inset:auto 0 0;z-index:10;height:auto;min-height:0;padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:block;background:#0c0e1ff2;border:0;border-top:1px solid #6e59a544;box-shadow:0 -10px 30px #03040d88;backdrop-filter:blur(18px)}
      .sidebar:after,.brand,.sidebar .account{display:none}
      .nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;margin:0;width:100%;min-width:0;overflow:visible}
      .nav button,.sidebar .nav button{display:flex;min-width:0;min-height:54px;padding:5px 1px 4px;flex-direction:column;justify-content:center;align-items:center;gap:2px;white-space:nowrap;overflow:hidden;border-radius:10px;text-align:center;font-size:10px;line-height:1.2}
      .nav button:before{content:"";display:block;width:18px;height:18px;color:#c2b5ee;font-size:17px;line-height:18px}
      .nav button[data-go="feed"]:before{content:"⌂"}
      .nav button[data-go="explore"]:before{content:"⌕"}
      .nav button[data-go="inbox"]:before{content:"✉"}
      .nav button[data-go="notifications"]:before{content:"◔"}
      .nav button[data-go="profile"]:before{content:"♙"}
      .nav button.active{background:#7551e82a;color:#fff;box-shadow:inset 0 0 0 1px #8a66ff50,0 0 20px #7044e91c}
      .nav button.active:before{color:#c6a9ff;text-shadow:0 0 10px #a178ff}
      .nav button[data-action="create-post"]{gap:2px}
      .nav button[data-action="create-post"] .nav-symbol{width:34px;height:34px;flex-basis:34px;border-radius:50%;font-size:24px;box-shadow:0 0 22px #885bff8c}
      .nav button[data-action="create-post"] .nav-label{font-size:10px}
      .nav .count-badge{position:absolute;min-width:14px;height:14px;padding:0 3px;margin:-20px 0 0 20px;font-size:9px}
      .main{padding:25px 17px 30px}
      .main h1{font-size:36px}
      .topline{gap:10px;align-items:flex-start;margin-bottom:20px}
      .topline .quiet{padding:8px 10px}
      .compose{padding:14px}
      .compose-foot{align-items:flex-end;flex-wrap:wrap}
      .compose-foot label{margin-right:auto}
      .form{padding:19px;margin-top:18px}
      .form label{line-height:1.45}
      .profile-hero{gap:16px;padding:12px 0 22px}
      .avatar-large{width:76px;height:76px}

    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    }

</head>
<body>
  <div id="root"></div><div id="toast" class="status hidden" role="status" aria-live="polite"></div>
  <script>
    const root=document.getElementById('root');let me=null,screen='feed',feedScope='all',activeConversation=null,toastTimer,pendingSignupEmail='',pendingRecoveryEmail='';
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function avatarMarkup(person, size=''){const name=String(person?.display_name||person?.username||'Member');const initials=name.trim().split(/\s+/).slice(0,2).map(part=>part[0]||'').join('').toUpperCase()||'Z';const classes=`avatar ${size} ${person?.avatar_url?'has-photo':'avatar-fallback'}`;const photo=person?.avatar_url?`<img src="${esc(person.avatar_url)}" alt="" loading="lazy" onerror="this.remove();this.parentElement.classList.remove('has-photo')">`:'';return `<span class="${classes}" role="img" aria-label="${person?.avatar_url?`Photo of ${esc(name)}`:`${esc(initials)} initials`}">${photo}<span class="avatar-initials" aria-hidden="true">${esc(initials)}</span></span>`}
    async function api(path,options={}){const headers={...(options.headers||{})};if(!(options.body instanceof FormData))headers['Content-Type']??='application/json';const r=await fetch(path,{credentials:'same-origin',...options,headers});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Something went wrong. Please try again.');return d}
    function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3600)}
    function nav(){return `<aside class="sidebar"><a class="brand" href="#" data-go="feed"><img src="assets/zorlii-logo.png" alt="">Zorlii</a><nav class="nav" aria-label="Main navigation">${[['feed','Pulse'],['explore','Explore']].map(([key,label])=>`<button type="button" class="${screen===key?'active':''}" data-go="${key}">${label}</button>`).join('')}<button type="button" data-action="create-post" aria-label="Create a post"><span class="nav-symbol" aria-hidden="true">+</span><span class="nav-label">Create</span></button>${[['inbox','Inbox'],['profile','You']].map(([key,label])=>`<button type="button" class="${screen===key?'active':''}" data-go="${key}">${label}</button>`).join('')}</nav><div class="account">${me?`${esc(me.display_name)}<div class="side-note">@${esc(me.username)}</div><button class="nav" data-action="logout">Sign out</button>`:'A quieter corner of the internet'}</div></aside>`}
    function base(content,aside=''){root.innerHTML=`<div class="shell">${nav()}<main class="main">${content}</main><aside class="right">${aside||'<section><h2>A little more room</h2><p class="tiny">Good conversations grow at their own pace. Follow people, share a thought, or simply read along.</p></section><section class="panel"><strong>Your privacy, your pace</strong><p class="tiny">Recommendations and local context help stay off unless you choose otherwise.</p></section>'}</aside></div>`}
    function authScreen(kind='login'){
      let form;
      if(kind==='verify-register'){
        form=`<form class="form" id="verify-register"><h2>Verify your email</h2><p class="muted">If your registration can be verified, a six-digit code may be sent to ${esc(pendingSignupEmail)}. It expires in 10 minutes.</p><input type="hidden" name="email" value="${esc(pendingSignupEmail)}"><label>Six-digit code<input type="text" inputmode="numeric" name="code" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><button class="primary">Verify and create account</button><p><button class="quiet" type="button" data-action="resend-signup">Resend code</button> <button class="quiet" type="button" data-auth="register">Start again</button></p></form>`;
      }else if(kind==='verify-reset'){
        form=`<form class="form" id="verify-reset"><h2>Reset your password</h2><p class="muted">If the address belongs to an account, a six-digit code may be sent. This response does not confirm delivery.</p><input type="hidden" name="email" value="${esc(pendingRecoveryEmail)}"><label>Email<input type="email" value="${esc(pendingRecoveryEmail)}" disabled></label><label>Six-digit code<input type="text" inputmode="numeric" name="code" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><label>New password<input type="password" name="password" minlength="4" maxlength="128" pattern="${passwordPolicyPattern}" title="${passwordPolicyMessage}" autocomplete="new-password" required><small>${passwordPolicyMessage}</small></label><button class="primary">Verify code and update password</button><p><button class="quiet" type="button" data-action="resend-recovery">Resend code</button> <button class="quiet" type="button" data-auth="forgot">Change email</button></p></form>`;
      }else if(kind==='forgot'){
        form=`<form class="form" id="forgot"><h2>Reset your password</h2><p class="muted">Enter your email. If an account exists, we’ll send a one-time code.</p><label>Email<input type="email" name="email" required autocomplete="email"></label><button class="primary">Send verification code</button><p><button class="quiet" type="button" data-auth="login">Back to sign in</button></p></form>`;
      }else{
        const reg=kind==='register';
        form=`<form class="form" id="auth" data-mode="${kind}"><h2>${reg?'Create your account':'Welcome back'}</h2>${reg?'<label>Display name<input type="text" name="display_name" maxlength="60" required autocomplete="name"></label><label>Username<input type="text" name="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" required autocomplete="username"><small>3–24 letters, numbers, or underscores.</small></label>':''}<label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" minlength="${reg?4:1}" ${reg?`maxlength="128" pattern="${passwordPolicyPattern}" title="${passwordPolicyMessage}"`:''} required autocomplete="${reg?'new-password':'current-password'}">${reg?`<small>${passwordPolicyMessage}</small>`:''}</label><button class="primary">${reg?'Continue to email verification':'Sign in'}</button><p><button class="quiet" type="button" data-auth="${reg?'login':'register'}">${reg?'Already a member? Sign in':'Create an account'}</button> <button class="quiet" type="button" data-auth="forgot">Forgot password?</button></p></form>`;
      }
      base(`<div class="topline"><div><div class="eyebrow">A thoughtful little corner</div><h1>Zorlii</h1><p class="subtitle">Make room for the conversations that matter.</p></div></div>${form}`);
    }
    async function renderFeed(){screen='feed';const data=await api(`/api/feed?scope=${feedScope}`);const cards=data.posts.map(p=>{const media=(p.media||[]).map(item=>item.media_type.startsWith('video/')?`<video controls preload="metadata" playsinline src="${esc(item.url)}"></video>`:`<img src="${esc(item.url)}" alt="Media attached to this post" loading="lazy">`).join('');return `<article class="post" data-post="${p.id}"><div class="post-head">${avatarMarkup(p.author)}<div class="identity"><strong>${esc(p.author.display_name)}</strong><span class="handle">@${esc(p.author.username)} · ${esc(p.created_at)}</span></div></div>${p.body?`<div class="post-copy">${esc(p.body)}</div>`:''}${media?`<div class="post-media">${media}</div>`:''}<div class="post-actions"><button data-action="react" data-id="${p.id}" class="${p.reacted?'selected':''}" aria-pressed="${p.reacted}">♥ ${p.reaction_count}</button><button data-action="bookmark" data-id="${p.id}" class="${p.bookmarked?'selected':''}">${p.bookmarked?'Saved':'Save'}</button><button data-action="replies" data-id="${p.id}">Reply · ${p.reply_count}</button><button data-action="message" data-user="${esc(p.author.username)}">Message</button></div><div id="replies-${p.id}"></div></article>`}).join('');
      base(`<div class="topline"><div><div class="eyebrow">Your community, in focus</div><h1>Pulse</h1><p class="subtitle">A little space to share what’s on your mind.</p></div><button class="quiet" data-action="refresh">Refresh</button></div>${me?`<form class="compose" id="compose"><label class="sr-only" for="post-body">Write a post</label><textarea class="field" id="post-body" name="body" maxlength="5000" placeholder="What would you like to share?"></textarea><div class="compose-foot"><label class="media-picker quiet">Add pictures or videos<input id="post-media" type="file" accept="image/*,video/*" multiple></label><div id="selected-media" class="selected-media"></div><label class="tiny">Who can see it? <select name="visibility"><option value="public">Everyone</option><option value="followers">Followers</option><option value="private">Only me</option></select></label><button class="primary">Share thought</button></div></form>`:`<div class="panel"><strong>Join when you’re ready.</strong><p class="tiny">Sign in to share, follow people, and save posts.</p><button class="primary" data-auth="login">Sign in</button></div>`}<div class="topline"><button class="quiet" data-scope="all">Everyone</button><button class="quiet" data-scope="following">Following</button><button class="quiet" data-scope="bookmarks">Saved</button></div>${cards||`<div class="empty"><h2>Nothing here just yet.</h2><p>New conversations will appear here when members share them.</p>${me?'<p>Be the first to start a conversation.</p>':''}</div>`}`)}
    async function renderExplore(){screen='explore';base(`<div class="eyebrow">Find your people</div><h1>Explore</h1><p class="subtitle">Search real members and their public conversations.</p><form id="search-form"><input type="search" name="q" placeholder="Search names, handles, and posts" required><button class="primary">Search</button></form><div id="search-results" class="empty"><p>Search when you know what you’re looking for.</p></div>`)}
    async function renderProfile(){screen='profile';const u=(await api('/api/me')).user;me=u;base(`<div class="eyebrow">Your space</div><header class="profile-hero">${avatarMarkup(u,'avatar-large')}<div><h1>${esc(u.display_name)}</h1><p class="handle">@${esc(u.username)} · ${esc(u.email)}</p><p class="subtitle">${esc(u.bio||'Add a few words about yourself.')}</p></div></header><div class="avatar-editor"><input id="avatar-file" type="file" accept="image/*" hidden><button type="button" class="quiet" data-action="avatar-pick">${u.avatar_url?'Change profile photo':'Add profile photo'}</button>${u.avatar_url?'<button type="button" class="quiet" data-action="avatar-remove">Remove photo</button>':''}<p class="tiny">Your photo appears alongside your profile and posts.</p></div><form class="form" id="profile-form"><h2>Profile & choices</h2><label>Display name<input name="display_name" value="${esc(u.display_name)}" maxlength="60" required></label><label>About you<textarea name="bio" maxlength="280">${esc(u.bio||'')}</textarea></label><label>Interests <small>Only used for recommendations if enabled</small><input name="interests" value="${esc(u.interests.join(', '))}" maxlength="480"></label><h3>Privacy &amp; local tools</h3><p class="tiny privacy-note">Both features stay off until you opt in. Recommendations compare real public posts; context help selects supplied sentences. No generative AI is used.</p><label class="switchline"><input type="checkbox" name="recommendations_consent" ${u.recommendations_consent?'checked':''}> I want local member recommendations based on real public posts. No generative AI service is used.</label><label class="switchline"><input type="checkbox" name="context_assistance_consent" ${u.context_assistance_consent?'checked':''}> I want local extractive context help. Each request still requires confirmation; no generated answers are produced.</label><button class="primary">Save profile</button><button type="button" class="quiet" data-action="logout">Sign out</button></form>${u.recommendations_consent?'<section class="profile"><h2>Member suggestions</h2><p class="tiny">A local comparison of opted-in interests and real public posts. This stays on your Zorlii server.</p><button class="quiet" data-action="recommendations">Find members</button><div id="recommendation-results"></div></section>':''}<section class="profile"><h2>Your posts</h2><button class="quiet" data-go="feed">View Pulse</button></section><section class="profile"><h2>Your data</h2><p class="tiny">Export a copy of your account data or permanently delete your account.</p><button class="quiet" data-action="export-account">Download my data</button> <button class="quiet danger" data-go="delete-account">Delete account</button></section>`)}
    function renderDeleteAccount(){screen='delete-account';base(`<div class="eyebrow">Account controls</div><h1>Delete account</h1><p class="subtitle">This permanently deletes your account, profile, posts, replies, follows, saved items, and messages you sent. Messages sent by other people remain in their accounts.</p><form class="form" id="delete-account"><label>Current password<input type="password" name="password" autocomplete="current-password" required></label><label>Type your username to confirm<small>Enter ${esc(me?.username||'')} exactly, without @.</small><input name="confirmation" autocomplete="off" required></label><button class="primary danger">Permanently delete my account</button><button type="button" class="quiet" data-go="profile">Cancel</button></form>`)}
    async function renderInbox(){screen='inbox';const data=await api('/api/conversations');const rows=data.conversations.map(c=>`<button class="thread" data-conversation="${c.id}"><strong>${esc(c.participants.map(p=>p.display_name).join(', ')||'Conversation')}</strong><div class="tiny">${esc(c.last_message||'No messages yet')}</div></button>`).join('');base(`<div class="eyebrow">Private conversations</div><h1>Inbox</h1><p class="subtitle">Only conversation members can read these messages.</p><form id="new-conversation"><input name="username" placeholder="Start with a username" required><button class="primary">Start conversation</button></form><div>${rows||'<div class="empty"><h2>Your inbox is quiet.</h2><p>Start a conversation with a member by username.</p></div>'}</div><div id="conversation-view"></div>`)}
    async function openConversation(id){activeConversation=id;const d=await api(`/api/conversations/${id}/messages`);const target=document.getElementById('conversation-view');if(!target)return;target.innerHTML=`<h2>Conversation</h2><div class="messages">${d.messages.map(m=>`<div class="bubble ${m.sender_id===me.id?'mine':''}"><div class="message-author">${avatarMarkup(m.author,'avatar-tiny')}<strong>${esc(m.author.display_name)}</strong></div>${esc(m.body)}</div>`).join('')||'<p class="tiny">No messages yet. Say hello when you’re ready.</p>'}</div><form id="send-message" data-id="${id}" class="replybox"><input name="body" maxlength="4000" placeholder="Write a message…" required><button class="primary">Send</button></form>`}
    async function refresh(){try{if(!me){authScreen();return}if(screen==='feed')await renderFeed();else if(screen==='explore')await renderExplore();else if(screen==='inbox')await renderInbox();else if(screen==='profile')await renderProfile();else if(screen==='delete-account')renderDeleteAccount()}catch(e){toast(e.message)}}
    document.addEventListener('click',async e=>{const b=e.target.closest('button,a');if(!b)return;try{if(b.dataset.auth){authScreen(b.dataset.auth);return}if(b.dataset.action==='create-post'){if(!me){authScreen();return}if(screen!=='feed')await renderFeed();requestAnimationFrame(()=>document.getElementById('post-body')?.focus());return}if(b.dataset.go){if(b.dataset.go==='profile'&&!me){authScreen();return}if(b.dataset.go==='feed')await renderFeed();if(b.dataset.go==='explore')await renderExplore();if(b.dataset.go==='inbox')await renderInbox();if(b.dataset.go==='profile')await renderProfile();if(b.dataset.go==='delete-account')renderDeleteAccount();return}if(b.dataset.scope){feedScope=b.dataset.scope;await renderFeed();return}if(b.dataset.conversation){await openConversation(b.dataset.conversation);return}if(b.dataset.action==='logout'){await api('/api/auth/logout',{method:'POST'});me=null;authScreen();toast('You’ve signed out.');return}if(b.dataset.action==='export-account'){const data=await api('/api/account/export');const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='zorlii-account-export.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);return}if(b.dataset.action==='refresh'){await renderFeed();return}if(['react','bookmark'].includes(b.dataset.action)){const suffix=b.dataset.action==='react'?'reaction':'bookmark';await api(`/api/posts/${b.dataset.id}/${suffix}`,{method:'POST'});await renderFeed();return}if(b.dataset.action==='replies'){const d=await api(`/api/posts/${b.dataset.id}`);const box=document.getElementById(`replies-${b.dataset.id}`);box.innerHTML=`${d.replies.map(r=>`<p class="tiny"><strong>@${esc(r.author.username)}</strong> ${esc(r.body)}</p>`).join('')}<form class="replybox" data-reply="${b.dataset.id}"><input name="body" maxlength="4000" placeholder="Add a thoughtful reply…" required><button class="primary">Reply</button></form>`;return}if(b.dataset.action==='message'){const d=await api('/api/conversations',{method:'POST',body:JSON.stringify({username:b.dataset.user})});await renderInbox();await openConversation(d.id);return}}catch(err){toast(err.message)}});
    document.addEventListener('submit',async e=>{const f=e.target;if(!(f instanceof HTMLFormElement))return;e.preventDefault();const d=Object.fromEntries(new FormData(f).entries());try{if(f.id==='auth'){if(f.dataset.mode==='register'){const result=await api('/api/auth/register',{method:'POST',body:JSON.stringify(d)});pendingSignupEmail=d.email.trim().toLowerCase();authScreen('verify-register');toast(result.message)}else{const result=await api('/api/auth/login',{method:'POST',body:JSON.stringify(d)});me=result.user;await renderFeed()}}else if(f.id==='verify-register'){const result=await api('/api/auth/register/verify',{method:'POST',body:JSON.stringify(d)});me=result.user;pendingSignupEmail='';await renderFeed()}else if(f.id==='forgot'){const result=await api('/api/auth/forgot-password',{method:'POST',body:JSON.stringify(d)});pendingRecoveryEmail=d.email.trim().toLowerCase();authScreen('verify-reset');toast(result.message)}else if(f.id==='verify-reset'){await api('/api/auth/reset-password',{method:'POST',body:JSON.stringify(d)});pendingRecoveryEmail='';authScreen();toast('Password updated. Please sign in.')}else if(f.id==='compose'){const input=document.getElementById('post-media');const files=Array.from(input?.files||[]);if(!String(d.body||'').trim()&&!files.length)throw Error('Write a thought or add media before sharing.');if(files.length){const payload=new FormData();payload.append('body',String(d.body||''));payload.append('visibility',String(d.visibility||'public'));files.forEach(file=>payload.append('media',file,file.name));await api('/api/posts/media',{method:'POST',body:payload})}else{await api('/api/posts',{method:'POST',body:JSON.stringify(d)})}await renderFeed();toast('Your post is live.')}else if(f.id==='search-form'){const result=await api(`/api/search?q=${encodeURIComponent(d.q)}`);const target=document.getElementById('search-results');const people=result.people.map(p=>`<div class="search-result">${avatarMarkup(p)}<div><strong>${esc(p.display_name)}</strong> <span class="handle">@${esc(p.username)}</span><p>${esc(p.bio||'')}</p><button class="quiet" data-action="follow" data-user="${esc(p.username)}">Follow</button><button class="quiet" data-action="message" data-user="${esc(p.username)}">Message</button></div></div>`).join('');const posts=result.posts.map(p=>`<article class="post"><strong>${esc(p.author.display_name)} · @${esc(p.author.username)}</strong><p>${esc(p.body)}</p></article>`).join('');target.className='';target.innerHTML=people+posts||'<div class="empty"><p>No matching members or public posts yet.</p></div>'}else if(f.id==='profile-form'){const interests=d.interests.split(',').map(s=>s.trim()).filter(Boolean);me=(await api('/api/profile',{method:'PATCH',body:JSON.stringify({...d,interests,recommendations_consent:f.elements.recommendations_consent.checked,context_assistance_consent:f.elements.context_assistance_consent.checked})})).user;await renderProfile();toast('Profile saved.')}else if(f.id==='delete-account'){if(d.confirmation!==me.username)throw Error('Enter your exact username to confirm account deletion.');await api('/api/account',{method:'DELETE',body:JSON.stringify({password:d.password})});me=null;authScreen();toast('Your account and account-owned content have been deleted.')}else if(f.id==='new-conversation'){const c=await api('/api/conversations',{method:'POST',body:JSON.stringify(d)});await renderInbox();await openConversation(c.id)}else if(f.id==='send-message'){await api(`/api/conversations/${f.dataset.id}/messages`,{method:'POST',body:JSON.stringify(d)});await openConversation(f.dataset.id)}else if(f.matches('[data-reply]')){await api(`/api/posts/${f.dataset.reply}/replies`,{method:'POST',body:JSON.stringify(d)});await renderFeed();toast('Reply added.')}}catch(err){toast(err.message)}});
    document.addEventListener('click',async e=>{const b=e.target.closest('[data-action="resend-signup"],[data-action="resend-recovery"]');if(!b)return;try{const signup=b.dataset.action==='resend-signup';const result=await api(signup?'/api/auth/register/resend':'/api/auth/forgot-password',{method:'POST',body:JSON.stringify({email:signup?pendingSignupEmail:pendingRecoveryEmail})});toast(result.message)}catch(err){toast(err.message)}});
    document.addEventListener('click',async e=>{const b=e.target.closest('[data-action="recommendations"]');if(!b)return;try{const result=await api('/api/recommendations');const target=document.getElementById('recommendation-results');target.innerHTML=result.recommendations.length?result.recommendations.map(p=>`<div class="search-result">${avatarMarkup(p)}<div><strong>${esc(p.display_name)}</strong> <span class="handle">@${esc(p.username)}</span><p class="tiny">${esc(p.bio||'')}</p><button class="quiet" data-action="follow" data-user="${esc(p.username)}">Follow</button><button class="quiet" data-action="message" data-user="${esc(p.username)}">Message</button></div></div>`).join(''):'<p class="tiny">No related public posts found yet.</p>'}catch(err){toast(err.message)}});
    document.addEventListener('click',async e=>{const b=e.target.closest('[data-action="follow"]');if(!b)return;try{const result=await api(`/api/users/${encodeURIComponent(b.dataset.user)}/follow`,{method:'POST'});b.textContent=result.following?'Following':'Follow'}catch(err){toast(err.message)}});
    (async()=>{try{me=(await api('/api/me')).user;await renderFeed()}catch{me=null;authScreen()}})();
  </script>
  <script>
    const passwordPolicyMessage = "Use 4–128 characters, including an uppercase letter, a lowercase letter, a number, and a special character.";
    const passwordPolicyPattern = "(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9\\s]).{4,128}";
    let notificationUnreadCount = 0;
    const addedStyles = document.createElement("style");
    addedStyles.textContent = `
      .count-badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:5px;border-radius:10px;background:#d9d0f0;color:#30264f;font-size:11px;font-weight:700}
      .notification-item{padding:17px 18px;margin:12px 0;background:#fff;border:1px solid var(--line);border-left:4px solid transparent;border-radius:10px;color:#000}
      .notification-item.unread{border-left-color:var(--lav);background:#f5f2fb}
      .notification-item p{margin:5px 0 10px;color:#000}.notification-item time{color:#000;font-size:12px}.notification-item .handle,.notification-item .tiny{color:#000!important}
      .social-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:18px 0 25px}
      .social-list section{min-width:0}.social-person{padding:9px 0;border-bottom:1px solid var(--line)}
      .social-person strong{display:block}.social-person span{color:var(--muted);font-size:13px}
      @media(max-width:670px){.social-list{grid-template-columns:1fr}}
    `;
    document.head.appendChild(addedStyles);

    function updateNotificationsButton() {
      const button = document.querySelector('nav[aria-label="Main navigation"] [data-go="notifications"]');
      if (!button) return;
      button.classList.toggle("active", screen === "notifications");
      const unreadLabel = notificationUnreadCount ? `, ${notificationUnreadCount} unread` : "";
      button.setAttribute("aria-label", `Notifications${unreadLabel}`);
      const label = window.matchMedia("(max-width: 670px)").matches ? "Alerts" : "Notifications";
      const content = `${label}${notificationUnreadCount ? `<span class="count-badge">${notificationUnreadCount}</span>` : ""}`;
      if (button.innerHTML !== content) button.innerHTML = content;
    }
    window.addEventListener("resize", updateNotificationsButton);

    function notificationDescription(item) {
      if (item.kind === "follow") return "started following you.";
      if (item.kind === "reply") return "replied to your post.";
      return "reacted to your post.";
    }

    async function renderNotifications() {
      screen = "notifications";
      base('<div class="eyebrow">Member activity</div><h1>Notifications</h1><p class="subtitle">Loading your updates…</p>');
      try {
        const data = await api("/api/notifications");
        notificationUnreadCount = data.unread_count;
        const rows = data.notifications.map(item => `<article class="notification-item ${item.read ? "read" : "unread"}">
          <div class="notification-person">${avatarMarkup(item.actor)}<div><strong>${esc(item.actor.display_name)}</strong> <span class="handle">@${esc(item.actor.username)}</span></div></div>
          <p>${esc(notificationDescription(item))}</p>
          <time>${esc(item.created_at)}</time>
          ${item.read ? '<span class="tiny"> · Read</span>' : `<button class="quiet" data-action="notification-read" data-id="${item.id}">Mark as read</button>`}
        </article>`).join("");
        base(`<div class="topline"><div><div class="eyebrow">Member activity</div><h1>Notifications</h1><p class="subtitle">Readable updates when members follow you, reply, or react.</p></div>
          <div>${notificationUnreadCount ? '<button class="quiet" data-action="notifications-read-all">Mark all as read</button>' : ""} <button class="quiet" data-action="notifications-refresh">Refresh</button></div></div>
          ${rows || '<div class="empty"><h2>You’re all caught up.</h2><p>New activity from real members will appear here.</p></div>'}`);
        updateNotificationsButton();
      } catch (error) {
        base(`<div class="eyebrow">Member activity</div><h1>Notifications</h1><div class="empty"><h2>Notifications could not be loaded.</h2><p>${esc(error.message || "Please try again.")}</p><button class="quiet" data-action="notifications-refresh">Try again</button></div>`);
        toast(error.message);
      }
    }

    async function renderSocialLists() {
      const form = document.getElementById("profile-form");
      if (!form || document.getElementById("social-lists") || !me) return;
      const section = document.createElement("section");
      section.id = "social-lists";
      section.className = "social-list";
      section.setAttribute("aria-live", "polite");
      section.innerHTML = '<p class="tiny">Loading your member lists…</p>';
      form.insertAdjacentElement("beforebegin", section);
      try {
        const [followers, following] = await Promise.all([
          api(`/api/users/${encodeURIComponent(me.username)}/followers?limit=100`),
          api(`/api/users/${encodeURIComponent(me.username)}/following?limit=100`),
        ]);
        if (!section.isConnected) return;
        const people = (items, empty) => items.map(person => `<div class="social-person">${avatarMarkup(person)}<div><strong>${esc(person.display_name)}</strong><span>@${esc(person.username)}</span></div></div>`).join("") || `<p class="tiny">${empty}</p>`;
        section.innerHTML = `<section><h2>Followers <span class="tiny">${followers.count}</span></h2>${people(followers.users, "No followers yet.")}</section>
          <section><h2>Following <span class="tiny">${following.count}</span></h2>${people(following.users, "You’re not following anyone yet.")}</section>`;
      } catch (error) {
        if (section.isConnected) section.innerHTML = `<p class="tiny">${esc(error.message || "Member lists could not be loaded.")}</p>`;
      }
    }

    function enhanceRenderedPage() {
      const nav = document.querySelector('nav[aria-label="Main navigation"]');
      if (nav && !nav.querySelector('[data-go="notifications"]')) {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.go = "notifications";
        button.className = screen === "notifications" ? "active" : "";
        nav.insertBefore(button, nav.querySelector('[data-go="profile"]'));
      }
      updateNotificationsButton();
      if (screen === "profile") renderSocialLists();
      const passwordInputs = [
        document.querySelector('#auth[data-mode="register"] input[name="password"]'),
        document.querySelector('#verify-reset input[name="password"]'),
      ].filter(Boolean);
      for (const input of passwordInputs) {
        input.minLength = 4;
        input.maxLength = 128;
        input.pattern = passwordPolicyPattern;
        input.title = passwordPolicyMessage;
        const help = input.parentElement.querySelector("small");
        if (help) {
          if (help.textContent !== passwordPolicyMessage) help.textContent = passwordPolicyMessage;
        } else {
          input.insertAdjacentHTML("afterend", `<small>${esc(passwordPolicyMessage)}</small>`);
        }
      }
    }

    document.addEventListener('click', event => {const button=event.target.closest('[data-action="avatar-pick"],[data-action="avatar-remove"]');if(!button)return;if(button.dataset.action==='avatar-pick'){document.getElementById('avatar-file')?.click();return}if(button.dataset.action==='avatar-remove'){api('/api/profile/avatar',{method:'DELETE'}).then(async()=>{await renderProfile();toast('Profile photo removed.')}).catch(error=>toast(error.message))}});
    document.addEventListener('change', async event => {const input=event.target;if(!(input instanceof HTMLInputElement))return;if(input.id==='post-media'){const target=document.getElementById('selected-media');if(target)target.textContent=Array.from(input.files||[]).map(file=>file.name).join(' · ');return}if(input.id!=='avatar-file')return;const file=input.files?.[0];if(!file)return;try{await api('/api/profile/avatar',{method:'PUT',body:file,headers:{'Content-Type':file.type||'application/octet-stream'}});await renderProfile();toast('Profile photo updated.')}catch(error){toast(error.message)}finally{input.value=''}});

    const pageEnhancer = new MutationObserver(enhanceRenderedPage);
    pageEnhancer.observe(root, { childList: true, subtree: true });

    document.addEventListener("click", async event => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.go === "notifications") {
        await renderNotifications();
        return;
      }
      try {
        if (button.dataset.action === "notifications-refresh") await renderNotifications();
        if (button.dataset.action === "notifications-read-all") {
          await api("/api/notifications/read", { method: "POST" });
          await renderNotifications();
        }
        if (button.dataset.action === "notification-read") {
          await api(`/api/notifications/${button.dataset.id}/read`, { method: "PATCH" });
          await renderNotifications();
        }
      } catch (error) {
        toast(error.message);
      }
    });
  </script>
</body>
</html>
