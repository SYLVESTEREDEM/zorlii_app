<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#19182b">
  <title>Zorlii — a thoughtful little corner</title>
  <style>
    :root{color-scheme:light;--ink:#1d1b32;--muted:#77758b;--line:#e7e4ee;--paper:#fbfaf8;--card:#fff;--lav:#7864bc;--lav2:#eee9f8;--shell:#1b192e;--shell2:#29263d;--serif:Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #aa97ea;outline-offset:2px}.shell{min-height:100vh;display:grid;grid-template-columns:245px minmax(0,760px) minmax(220px,300px);max-width:1510px;margin:auto}.sidebar{background:var(--shell);color:#e9e6f3;padding:28px 20px;display:flex;flex-direction:column;min-height:100vh;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;font:25px var(--serif);margin-bottom:43px}.brand img{width:42px;height:42px;object-fit:contain}.nav{display:grid;gap:8px}.nav button,.sidebar .account{border:0;background:none;color:#c5c1d4;text-align:left;padding:13px 15px;border-radius:12px;font-weight:600}.nav button:hover,.nav button.active{background:#302c46;color:#fff}.sidebar .account{margin-top:auto;border-top:1px solid #403c51;border-radius:0;padding:19px 4px 0;color:#e9e6f3}.side-note{color:#aaa6bc;font-size:12px;margin:6px 4px}.main{padding:42px clamp(22px,5vw,70px);min-width:0}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.eyebrow{letter-spacing:.13em;color:var(--lav);font-size:11px;font-weight:700;text-transform:uppercase}.main h1{font:42px/1.15 var(--serif);margin:7px 0}.subtitle{color:var(--muted);margin:4px 0 25px}.compose{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;margin:24px 0}.compose textarea,.form textarea{resize:vertical;min-height:90px}.field,textarea,input[type=text],input[type=email],input[type=password],input[type=search]{width:100%;border:1px solid var(--line);border-radius:9px;background:#fff;padding:11px 12px;color:var(--ink)}.form input:not([type=checkbox]):not([type=hidden]){width:100%;border:1px solid var(--line);border-radius:9px;background:#fff;padding:11px 12px;color:var(--ink)}.compose-foot{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:12px}.compose select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px;color:var(--muted)}.primary{border:0;background:var(--lav);color:#fff;border-radius:9px;padding:10px 17px;font-weight:700}.primary:hover{background:#6250a2}.quiet{border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;padding:9px 13px}.post{background:var(--card);border-bottom:1px solid var(--line);padding:22px 4px}.post-head{display:flex;gap:12px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;background:#e8e2f2;color:#524479;display:grid;place-items:center;font-weight:700}.identity{min-width:0}.identity strong{display:block}.handle,.muted{color:var(--muted);font-size:13px}.post-copy{white-space:pre-wrap;overflow-wrap:anywhere;margin:15px 0 17px}.post-actions{display:flex;gap:12px;flex-wrap:wrap}.post-actions button{border:0;background:none;color:#716e83;padding:6px 10px 6px 0}.post-actions button:hover,.post-actions button.selected{color:var(--lav)}.replybox{display:flex;gap:8px;margin-top:12px}.replybox input{flex:1}.empty{padding:38px 20px;text-align:center;border:1px dashed #d5d0e0;border-radius:16px;color:var(--muted);background:#fff}.empty h2{font:25px var(--serif);color:var(--ink);margin:0 0 8px}.right{border-left:1px solid var(--line);padding:40px 22px}.right section{margin-bottom:30px}.right h2{font:22px var(--serif)}.tiny{font-size:12px;color:var(--muted)}.panel{background:#f0edf5;padding:17px;border-radius:14px}.profile{padding:20px 4px;border-bottom:1px solid var(--line)}.form{max-width:440px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;margin-top:22px}.form label{display:block;margin:13px 0;font-weight:600}.form small{display:block;color:var(--muted);font-weight:400}.form .primary{width:100%;margin-top:8px}.switchline{display:flex!important;gap:10px;align-items:flex-start;font-weight:400!important}.status{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--shell);color:#fff;border-radius:10px;padding:12px 18px;box-shadow:0 8px 26px #19182b33;z-index:5}.hidden{display:none!important}.thread{border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;padding:14px 5px;color:var(--ink)}.messages{height:48vh;overflow:auto;border:1px solid var(--line);background:#fff;border-radius:14px;padding:16px}.bubble{max-width:80%;background:var(--lav2);padding:10px 14px;border-radius:14px;margin:8px 0}.bubble.mine{margin-left:auto;background:#e8e5f0}.search-result{padding:13px 5px;border-bottom:1px solid var(--line)}@media(max-width:1050px){.shell{grid-template-columns:210px minmax(0,760px)}.right{display:none}}@media(max-width:670px){.shell{display:block;padding-bottom:68px}.sidebar{height:auto;min-height:0;position:sticky;z-index:3;top:0;padding:10px 15px;display:block}.brand{margin:0;font-size:20px}.brand img{width:32px;height:32px}.side-note,.sidebar .account{display:none}.nav{display:flex;overflow:auto;gap:4px;margin-top:8px}.nav button{white-space:nowrap;padding:8px 12px}.main{padding:25px 20px}.main h1{font-size:35px}.topline{margin-bottom:20px}.compose{padding:13px}.form{padding:18px}}
  </style>
</head>
<body>
  <div id="root"></div><div id="toast" class="status hidden" role="status" aria-live="polite"></div>
  <script>
    const root=document.getElementById('root');let me=null,screen='feed',feedScope='all',activeConversation=null,toastTimer,pendingSignupEmail='',pendingRecoveryEmail='';
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function api(path,options={}){const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Something went wrong. Please try again.');return d}
    function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3600)}
    function nav(){return `<aside class="sidebar"><a class="brand" href="#" data-go="feed"><img src="assets/zorlii-logo.png" alt="">Zorlii</a><nav class="nav" aria-label="Main navigation">${[['feed','Pulse'],['explore','Explore'],['inbox','Inbox'],['profile','You']].map(([key,label])=>`<button class="${screen===key?'active':''}" data-go="${key}">${label}</button>`).join('')}</nav><div class="account">${me?`${esc(me.display_name)}<div class="side-note">@${esc(me.username)}</div><button class="nav" data-action="logout">Sign out</button>`:'A quieter corner of the internet'}</div></aside>`}
    function base(content,aside=''){root.innerHTML=`<div class="shell">${nav()}<main class="main">${content}</main><aside class="right">${aside||'<section><h2>A little more room</h2><p class="tiny">Good conversations grow at their own pace. Follow people, share a thought, or simply read along.</p></section><section class="panel"><strong>Your privacy, your pace</strong><p class="tiny">Recommendations and local context help stay off unless you choose otherwise.</p></section>'}</aside></div>`}
    function authScreen(kind='login'){
      let form;
      if(kind==='verify-register'){
        form=`<form class="form" id="verify-register"><h2>Verify your email</h2><p class="muted">If your registration can be verified, a six-digit code may be sent to ${esc(pendingSignupEmail)}. It expires in 10 minutes.</p><input type="hidden" name="email" value="${esc(pendingSignupEmail)}"><label>Six-digit code<input type="text" inputmode="numeric" name="code" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><button class="primary">Verify and create account</button><p><button class="quiet" type="button" data-action="resend-signup">Resend code</button> <button class="quiet" type="button" data-auth="register">Start again</button></p></form>`;
      }else if(kind==='verify-reset'){
        form=`<form class="form" id="verify-reset"><h2>Reset your password</h2><p class="muted">If the address belongs to an account, a six-digit code may be sent. This response does not confirm delivery.</p><input type="hidden" name="email" value="${esc(pendingRecoveryEmail)}"><label>Email<input type="email" value="${esc(pendingRecoveryEmail)}" disabled></label><label>Six-digit code<input type="text" inputmode="numeric" name="code" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><label>New password<input type="password" name="password" minlength="4" maxlength="128" pattern="${passwordPolicyPattern}" title="${passwordPolicyMessage}" autocomplete="new-password" required><small>${passwordPolicyMessage}</small></label><button class="primary">Verify code and update password</button><p><button class="quiet" type="button" data-action="resend-recovery">Resend code</button> <button class="quiet" type="button" data-auth="forgot">Change email</button></p></form>`;
      }else if(kind==='forgot'){
        form=`<form class="form" id="forgot"><h2>Reset your password</h2><p class="muted">Enter your email. If an account exists, we’ll send a one-time code.</p><label>Email<input type="email" name="email" required autocomplete="email"></label><button class="primary">Send verification code</button><p><button class="quiet" type="button" data-auth="login">Back to sign in</button></p></form>`;
      }else{
        const reg=kind==='register';
        form=`<form class="form" id="auth" data-mode="${kind}"><h2>${reg?'Create your account':'Welcome back'}</h2>${reg?'<label>Display name<input type="text" name="display_name" maxlength="60" required autocomplete="name"></label><label>Username<input type="text" name="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" required autocomplete="username"><small>3–24 letters, numbers, or underscores.</small></label>':''}<label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" minlength="${reg?4:1}" ${reg?`maxlength="128" pattern="${passwordPolicyPattern}" title="${passwordPolicyMessage}"`:''} required autocomplete="${reg?'new-password':'current-password'}">${reg?`<small>${passwordPolicyMessage}</small>`:''}</label><button class="primary">${reg?'Continue to email verification':'Sign in'}</button><p><button class="quiet" type="button" data-auth="${reg?'login':'register'}">${reg?'Already a member? Sign in':'Create an account'}</button> <button class="quiet" type="button" data-auth="forgot">Forgot password?</button></p></form>`;
      }
      base(`<div class="topline"><div><div class="eyebrow">A thoughtful little corner</div><h1>Zorlii</h1><p class="subtitle">Make room for the conversations that matter.</p></div></div>${form}`);
    }
    async function renderFeed(){screen='feed';const data=await api(`/api/feed?scope=${feedScope}`);const cards=data.posts.map(p=>`<article class="post" data-post="${p.id}"><div class="post-head"><div class="avatar">${esc(p.author.display_name.slice(0,1).toUpperCase())}</div><div class="identity"><strong>${esc(p.author.display_name)}</strong><span class="handle">@${esc(p.author.username)} · ${esc(p.created_at)}</span></div></div><div class="post-copy">${esc(p.body)}</div><div class="post-actions"><button data-action="react" data-id="${p.id}" class="${p.reacted?'selected':''}" aria-pressed="${p.reacted}">♥ ${p.reaction_count}</button><button data-action="bookmark" data-id="${p.id}" class="${p.bookmarked?'selected':''}">${p.bookmarked?'Saved':'Save'}</button><button data-action="replies" data-id="${p.id}">Reply · ${p.reply_count}</button><button data-action="message" data-user="${esc(p.author.username)}">Message</button></div><div id="replies-${p.id}"></div></article>`).join('');
      base(`<div class="topline"><div><div class="eyebrow">Your community, in focus</div><h1>Pulse</h1><p class="subtitle">A little space to share what’s on your mind.</p></div><button class="quiet" data-action="refresh">Refresh</button></div>${me?`<form class="compose" id="compose"><label class="sr-only" for="post-body">Write a post</label><textarea class="field" id="post-body" name="body" maxlength="5000" placeholder="What would you like to share?" required></textarea><div class="compose-foot"><label class="tiny">Who can see it? <select name="visibility"><option value="public">Everyone</option><option value="followers">Followers</option><option value="private">Only me</option></select></label><button class="primary">Share thought</button></div></form>`:`<div class="panel"><strong>Join when you’re ready.</strong><p class="tiny">Sign in to share, follow people, and save posts.</p><button class="primary" data-auth="login">Sign in</button></div>`}<div class="topline"><button class="quiet" data-scope="all">Everyone</button><button class="quiet" data-scope="following">Following</button><button class="quiet" data-scope="bookmarks">Saved</button></div>${cards||`<div class="empty"><h2>Nothing here just yet.</h2><p>New conversations will appear here when members share them.</p>${me?'<p>Be the first to start a conversation.</p>':''}</div>`}`)}
    async function renderExplore(){screen='explore';base(`<div class="eyebrow">Find your people</div><h1>Explore</h1><p class="subtitle">Search real members and their public conversations.</p><form id="search-form"><input type="search" name="q" placeholder="Search names, handles, and posts" required><button class="primary">Search</button></form><div id="search-results" class="empty"><p>Search when you know what you’re looking for.</p></div>`)}
    async function renderProfile(){screen='profile';const u=(await api('/api/me')).user;me=u;base(`<div class="eyebrow">Your space</div><h1>${esc(u.display_name)}</h1><p class="handle">@${esc(u.username)} · ${esc(u.email)}</p><p class="subtitle">${esc(u.bio||'Add a few words about yourself.')}</p><form class="form" id="profile-form"><h2>Profile & choices</h2><label>Display name<input name="display_name" value="${esc(u.display_name)}" maxlength="60" required></label><label>About you<textarea name="bio" maxlength="280">${esc(u.bio||'')}</textarea></label><label>Interests <small>Only used for recommendations if enabled</small><input name="interests" value="${esc(u.interests.join(', '))}" maxlength="480"></label><label class="switchline"><input type="checkbox" name="recommendations_consent" ${u.recommendations_consent?'checked':''}> I want member recommendations based on real public posts.</label><label class="switchline"><input type="checkbox" name="context_assistance_consent" ${u.context_assistance_consent?'checked':''}> I want local extractive context help. Each request still requires confirmation.</label><button class="primary">Save profile</button><button type="button" class="quiet" data-action="logout">Sign out</button></form>${u.recommendations_consent?'<section class="profile"><h2>Member suggestions</h2><p class="tiny">Uses only opted-in profile details and real public posts.</p><button class="quiet" data-action="recommendations">Find members</button><div id="recommendation-results"></div></section>':''}<section class="profile"><h2>Your posts</h2><button class="quiet" data-go="feed">View Pulse</button></section><section class="profile"><h2>Your data</h2><p class="tiny">Export a copy of your account data or permanently delete your account.</p><button class="quiet" data-action="export-account">Download my data</button> <button class="quiet danger" data-go="delete-account">Delete account</button></section>`)}
    function renderDeleteAccount(){screen='delete-account';base(`<div class="eyebrow">Account controls</div><h1>Delete account</h1><p class="subtitle">This permanently deletes your account, profile, posts, replies, follows, saved items, and messages you sent. Messages sent by other people remain in their accounts.</p><form class="form" id="delete-account"><label>Current password<input type="password" name="password" autocomplete="current-password" required></label><label>Type your username to confirm<small>Enter ${esc(me?.username||'')} exactly, without @.</small><input name="confirmation" autocomplete="off" required></label><button class="primary danger">Permanently delete my account</button><button type="button" class="quiet" data-go="profile">Cancel</button></form>`)}
    async function renderInbox(){screen='inbox';const data=await api('/api/conversations');const rows=data.conversations.map(c=>`<button class="thread" data-conversation="${c.id}"><strong>${esc(c.participants.map(p=>p.display_name).join(', ')||'Conversation')}</strong><div class="tiny">${esc(c.last_message||'No messages yet')}</div></button>`).join('');base(`<div class="eyebrow">Private conversations</div><h1>Inbox</h1><p class="subtitle">Only conversation members can read these messages.</p><form id="new-conversation"><input name="username" placeholder="Start with a username" required><button class="primary">Start conversation</button></form><div>${rows||'<div class="empty"><h2>Your inbox is quiet.</h2><p>Start a conversation with a member by username.</p></div>'}</div><div id="conversation-view"></div>`)}
    async function openConversation(id){activeConversation=id;const d=await api(`/api/conversations/${id}/messages`);const target=document.getElementById('conversation-view');if(!target)return;target.innerHTML=`<h2>Conversation</h2><div class="messages">${d.messages.map(m=>`<div class="bubble ${m.sender_id===me.id?'mine':''}"><strong>${esc(m.author.display_name)}</strong><br>${esc(m.body)}</div>`).join('')||'<p class="tiny">No messages yet. Say hello when you’re ready.</p>'}</div><form id="send-message" data-id="${id}" class="replybox"><input name="body" maxlength="4000" placeholder="Write a message…" required><button class="primary">Send</button></form>`}
    async function refresh(){try{if(!me){authScreen();return}if(screen==='feed')await renderFeed();else if(screen==='explore')await renderExplore();else if(screen==='inbox')await renderInbox();else if(screen==='profile')await renderProfile();else if(screen==='delete-account')renderDeleteAccount()}catch(e){toast(e.message)}}
    document.addEventListener('click',async e=>{const b=e.target.closest('button,a');if(!b)return;try{if(b.dataset.auth){authScreen(b.dataset.auth);return}if(b.dataset.go){if(b.dataset.go==='profile'&&!me){authScreen();return}if(b.dataset.go==='feed')await renderFeed();if(b.dataset.go==='explore')await renderExplore();if(b.dataset.go==='inbox')await renderInbox();if(b.dataset.go==='profile')await renderProfile();if(b.dataset.go==='delete-account')renderDeleteAccount();return}if(b.dataset.scope){feedScope=b.dataset.scope;await renderFeed();return}if(b.dataset.conversation){await openConversation(b.dataset.conversation);return}if(b.dataset.action==='logout'){await api('/api/auth/logout',{method:'POST'});me=null;authScreen();toast('You’ve signed out.');return}if(b.dataset.action==='export-account'){const data=await api('/api/account/export');const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='zorlii-account-export.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);return}if(b.dataset.action==='refresh'){await renderFeed();return}if(['react','bookmark'].includes(b.dataset.action)){const suffix=b.dataset.action==='react'?'reaction':'bookmark';await api(`/api/posts/${b.dataset.id}/${suffix}`,{method:'POST'});await renderFeed();return}if(b.dataset.action==='replies'){const d=await api(`/api/posts/${b.dataset.id}`);const box=document.getElementById(`replies-${b.dataset.id}`);box.innerHTML=`${d.replies.map(r=>`<p class="tiny"><strong>@${esc(r.author.username)}</strong> ${esc(r.body)}</p>`).join('')}<form class="replybox" data-reply="${b.dataset.id}"><input name="body" maxlength="4000" placeholder="Add a thoughtful reply…" required><button class="primary">Reply</button></form>`;return}if(b.dataset.action==='message'){const d=await api('/api/conversations',{method:'POST',body:JSON.stringify({username:b.dataset.user})});await renderInbox();await openConversation(d.id);return}}catch(err){toast(err.message)}});
    document.addEventListener('submit',async e=>{const f=e.target;if(!(f instanceof HTMLFormElement))return;e.preventDefault();const d=Object.fromEntries(new FormData(f).entries());try{if(f.id==='auth'){if(f.dataset.mode==='register'){const result=await api('/api/auth/register',{method:'POST',body:JSON.stringify(d)});pendingSignupEmail=d.email.trim().toLowerCase();authScreen('verify-register');toast(result.message)}else{const result=await api('/api/auth/login',{method:'POST',body:JSON.stringify(d)});me=result.user;await renderFeed()}}else if(f.id==='verify-register'){const result=await api('/api/auth/register/verify',{method:'POST',body:JSON.stringify(d)});me=result.user;pendingSignupEmail='';await renderFeed()}else if(f.id==='forgot'){const result=await api('/api/auth/forgot-password',{method:'POST',body:JSON.stringify(d)});pendingRecoveryEmail=d.email.trim().toLowerCase();authScreen('verify-reset');toast(result.message)}else if(f.id==='verify-reset'){await api('/api/auth/reset-password',{method:'POST',body:JSON.stringify(d)});pendingRecoveryEmail='';authScreen();toast('Password updated. Please sign in.')}else if(f.id==='compose'){await api('/api/posts',{method:'POST',body:JSON.stringify(d)});await renderFeed();toast('Your post is live.')}else if(f.id==='search-form'){const result=await api(`/api/search?q=${encodeURIComponent(d.q)}`);const target=document.getElementById('search-results');const people=result.people.map(p=>`<div class="search-result"><strong>${esc(p.display_name)}</strong> <span class="handle">@${esc(p.username)}</span><p>${esc(p.bio||'')}</p><button class="quiet" data-action="follow" data-user="${esc(p.username)}">Follow</button><button class="quiet" data-action="message" data-user="${esc(p.username)}">Message</button></div>`).join('');const posts=result.posts.map(p=>`<article class="post"><strong>${esc(p.author.display_name)} · @${esc(p.author.username)}</strong><p>${esc(p.body)}</p></article>`).join('');target.className='';target.innerHTML=people+posts||'<div class="empty"><p>No matching members or public posts yet.</p></div>'}else if(f.id==='profile-form'){const interests=d.interests.split(',').map(s=>s.trim()).filter(Boolean);me=(await api('/api/profile',{method:'PATCH',body:JSON.stringify({...d,interests,recommendations_consent:f.elements.recommendations_consent.checked,context_assistance_consent:f.elements.context_assistance_consent.checked})})).user;await renderProfile();toast('Profile saved.')}else if(f.id==='delete-account'){if(d.confirmation!==me.username)throw Error('Enter your exact username to confirm account deletion.');await api('/api/account',{method:'DELETE',body:JSON.stringify({password:d.password})});me=null;authScreen();toast('Your account and account-owned content have been deleted.')}else if(f.id==='new-conversation'){const c=await api('/api/conversations',{method:'POST',body:JSON.stringify(d)});await renderInbox();await openConversation(c.id)}else if(f.id==='send-message'){await api(`/api/conversations/${f.dataset.id}/messages`,{method:'POST',body:JSON.stringify(d)});await openConversation(f.dataset.id)}else if(f.matches('[data-reply]')){await api(`/api/posts/${f.dataset.reply}/replies`,{method:'POST',body:JSON.stringify(d)});await renderFeed();toast('Reply added.')}}catch(err){toast(err.message)}});
    document.addEventListener('click',async e=>{const b=e.target.closest('[data-action="resend-signup"],[data-action="resend-recovery"]');if(!b)return;try{const signup=b.dataset.action==='resend-signup';const result=await api(signup?'/api/auth/register/resend':'/api/auth/forgot-password',{method:'POST',body:JSON.stringify({email:signup?pendingSignupEmail:pendingRecoveryEmail})});toast(result.message)}catch(err){toast(err.message)}});
    document.addEventListener('click',async e=>{const b=e.target.closest('[data-action="recommendations"]');if(!b)return;try{const result=await api('/api/recommendations');const target=document.getElementById('recommendation-results');target.innerHTML=result.recommendations.length?result.recommendations.map(p=>`<div class="search-result"><strong>${esc(p.display_name)}</strong> <span class="handle">@${esc(p.username)}</span><p class="tiny">${esc(p.bio||'')}</p><button class="quiet" data-action="follow" data-user="${esc(p.username)}">Follow</button><button class="quiet" data-action="message" data-user="${esc(p.username)}">Message</button></div>`).join(''):'<p class="tiny">No related public posts found yet.</p>'}catch(err){toast(err.message)}});
    document.addEventListener('click',async e=>{const b=e.target.closest('[data-action="follow"]');if(!b)return;try{const result=await api(`/api/users/${encodeURIComponent(b.dataset.user)}/follow`,{method:'POST'});b.textContent=result.following?'Following':'Follow'}catch(err){toast(err.message)}});
    (async()=>{try{me=(await api('/api/me')).user;await renderFeed()}catch{me=null;authScreen()}})();
  </script>
  <script>
    const passwordPolicyMessage = "Use 4–128 characters, including an uppercase letter, a lowercase letter, a number, and a special character.";
    const passwordPolicyPattern = "(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9\\s]).{4,128}";
    let notificationUnreadCount = 0;
    const addedStyles = document.createElement("style");
    addedStyles.textContent = `
      .count-badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:5px;border-radius:10px;background:#d9d0f0;color:#30264f;font-size:11px;font-weight:700}
      .notification-item{padding:17px 18px;margin:12px 0;background:#fff;border:1px solid var(--line);border-left:4px solid transparent;border-radius:10px}
      .notification-item.unread{border-left-color:var(--lav);background:#f5f2fb}
      .notification-item p{margin:5px 0 10px}.notification-item time{color:var(--muted);font-size:12px}
      .social-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:18px 0 25px}
      .social-list section{min-width:0}.social-person{padding:9px 0;border-bottom:1px solid var(--line)}
      .social-person strong{display:block}.social-person span{color:var(--muted);font-size:13px}
      @media(max-width:670px){.social-list{grid-template-columns:1fr}}
    `;
    document.head.appendChild(addedStyles);

    function updateNotificationsButton() {
      const button = document.querySelector('nav[aria-label="Main navigation"] [data-go="notifications"]');
      if (!button) return;
      button.classList.toggle("active", screen === "notifications");
      const content = `Notifications${notificationUnreadCount ? `<span class="count-badge" aria-label="${notificationUnreadCount} unread">${notificationUnreadCount}</span>` : ""}`;
      if (button.innerHTML !== content) button.innerHTML = content;
    }

    function notificationDescription(item) {
      if (item.kind === "follow") return "started following you.";
      if (item.kind === "reply") return "replied to your post.";
      return "reacted to your post.";
    }

    async function renderNotifications() {
      screen = "notifications";
      base('<div class="eyebrow">Member activity</div><h1>Notifications</h1><p class="subtitle">Loading your updates…</p>');
      try {
        const data = await api("/api/notifications");
        notificationUnreadCount = data.unread_count;
        const rows = data.notifications.map(item => `<article class="notification-item ${item.read ? "read" : "unread"}">
          <strong>${esc(item.actor.display_name)}</strong> <span class="handle">@${esc(item.actor.username)}</span>
          <p>${esc(notificationDescription(item))}</p>
          <time>${esc(item.created_at)}</time>
          ${item.read ? '<span class="tiny"> · Read</span>' : `<button class="quiet" data-action="notification-read" data-id="${item.id}">Mark as read</button>`}
        </article>`).join("");
        base(`<div class="topline"><div><div class="eyebrow">Member activity</div><h1>Notifications</h1><p class="subtitle">Readable updates when members follow you, reply, or react.</p></div>
          <div>${notificationUnreadCount ? '<button class="quiet" data-action="notifications-read-all">Mark all as read</button>' : ""} <button class="quiet" data-action="notifications-refresh">Refresh</button></div></div>
          ${rows || '<div class="empty"><h2>You’re all caught up.</h2><p>New activity from real members will appear here.</p></div>'}`);
        updateNotificationsButton();
      } catch (error) {
        base(`<div class="eyebrow">Member activity</div><h1>Notifications</h1><div class="empty"><h2>Notifications could not be loaded.</h2><p>${esc(error.message || "Please try again.")}</p><button class="quiet" data-action="notifications-refresh">Try again</button></div>`);
        toast(error.message);
      }
    }

    async function renderSocialLists() {
      const form = document.getElementById("profile-form");
      if (!form || document.getElementById("social-lists") || !me) return;
      const section = document.createElement("section");
      section.id = "social-lists";
      section.className = "social-list";
      section.setAttribute("aria-live", "polite");
      section.innerHTML = '<p class="tiny">Loading your member lists…</p>';
      form.insertAdjacentElement("beforebegin", section);
      try {
        const [followers, following] = await Promise.all([
          api(`/api/users/${encodeURIComponent(me.username)}/followers?limit=100`),
          api(`/api/users/${encodeURIComponent(me.username)}/following?limit=100`),
        ]);
        if (!section.isConnected) return;
        const people = (items, empty) => items.map(person => `<div class="social-person"><strong>${esc(person.display_name)}</strong><span>@${esc(person.username)}</span></div>`).join("") || `<p class="tiny">${empty}</p>`;
        section.innerHTML = `<section><h2>Followers <span class="tiny">${followers.count}</span></h2>${people(followers.users, "No followers yet.")}</section>
          <section><h2>Following <span class="tiny">${following.count}</span></h2>${people(following.users, "You’re not following anyone yet.")}</section>`;
      } catch (error) {
        if (section.isConnected) section.innerHTML = `<p class="tiny">${esc(error.message || "Member lists could not be loaded.")}</p>`;
      }
    }

    function enhanceRenderedPage() {
      const nav = document.querySelector('nav[aria-label="Main navigation"]');
      if (nav && !nav.querySelector('[data-go="notifications"]')) {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.go = "notifications";
        button.className = screen === "notifications" ? "active" : "";
        nav.appendChild(button);
      }
      updateNotificationsButton();
      if (screen === "profile") renderSocialLists();
      const passwordInputs = [
        document.querySelector('#auth[data-mode="register"] input[name="password"]'),
        document.querySelector('#verify-reset input[name="password"]'),
      ].filter(Boolean);
      for (const input of passwordInputs) {
        input.minLength = 4;
        input.maxLength = 128;
        input.pattern = passwordPolicyPattern;
        input.title = passwordPolicyMessage;
        const help = input.parentElement.querySelector("small");
        if (help) {
          if (help.textContent !== passwordPolicyMessage) help.textContent = passwordPolicyMessage;
        } else {
          input.insertAdjacentHTML("afterend", `<small>${esc(passwordPolicyMessage)}</small>`);
        }
      }
    }

    const pageEnhancer = new MutationObserver(enhanceRenderedPage);
    pageEnhancer.observe(root, { childList: true, subtree: true });

    document.addEventListener("click", async event => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.go === "notifications") {
        await renderNotifications();
        return;
      }
      try {
        if (button.dataset.action === "notifications-refresh") await renderNotifications();
        if (button.dataset.action === "notifications-read-all") {
          await api("/api/notifications/read", { method: "POST" });
          await renderNotifications();
        }
        if (button.dataset.action === "notification-read") {
          await api(`/api/notifications/${button.dataset.id}/read`, { method: "PATCH" });
          await renderNotifications();
        }
      } catch (error) {
        toast(error.message);
      }
    });
  </script>
</body>
</html>
